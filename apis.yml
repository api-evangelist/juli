aid: juli
name: Juli
description: >-
  Juli is a US-based (Hull, Massachusetts) digital-health company building an
  AI-powered mobile platform that helps people manage complex, hard-to-treat
  chronic conditions — including asthma, migraine, depression, and bipolar
  disorder. The app combines patient-reported symptoms, wearable and phone
  sensor data, and environmental context (weather, air quality, pollen) to
  surface the micro-behavioral triggers that worsen or improve a person's
  condition, then nudges small, sustainable changes through daily check-ins,
  reminders, and gamified "daily dares." Juli's efficacy has been evaluated in
  two randomized controlled trials (asthma and depression), published in JMIR
  and a SAGE journal, and the company reports retention far above consumer-health
  norms. Founded by Bettina Duehrkoop, Juli raised a $3.8M seed round in March
  2022 co-led by Speedinvest and Norrsken VC. It serves consumers directly plus
  provider, employer, education (juli.education), pharma, and research
  (juli.science) channels. Juli is a consumer/clinical app with a HIPAA / SOC 2 /
  GDPR compliance posture; it publishes no public developer API, SDK, or
  developer portal at this time.
